# Render Blueprint: one free web service + one free PostgreSQL database.
# In Render: New + → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: ctent
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --omit=optional
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ctent-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_LOGINS
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "10"
      # Free AI for the research agents — paste your key from https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Optional: a free OpenAlex key raises the daily search budget (https://openalex.org/settings/api)
      - key: OPENALEX_API_KEY
        sync: false

databases:
  - name: ctent-db
    plan: free
    databaseName: ctent
    user: ctent
    ipAllowList: []
